<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unifresh Product Image Uploader</title>
<style>
  :root {
    --orange: #f6821f;
    --dark: #1a1a1a;
    --gray: #6b7280;
    --light-bg: #f7f7f8;
    --border: #e5e7eb;
    --success: #16a34a;
    --error: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--light-bg);
    color: var(--dark);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    max-width: 560px;
    width: 100%;
    padding: 32px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--gray);
    font-size: 14px;
    margin: 0 0 24px;
  }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .dropzone.dragover {
    border-color: var(--orange);
    background: #fff7ed;
  }
  .dropzone p {
    margin: 8px 0 0;
    color: var(--gray);
    font-size: 14px;
  }
  .dropzone .icon {
    font-size: 32px;
  }
  input[type="file"] { display: none; }
  .preview {
    margin-top: 20px;
    display: none;
  }
  .preview img {
    max-width: 100%;
    max-height: 220px;
    border-radius: 8px;
    display: block;
    margin: 0 auto 12px;
    border: 1px solid var(--border);
  }
  .filename {
    font-size: 13px;
    color: var(--gray);
    text-align: center;
    word-break: break-all;
  }
  button.upload-btn {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: var(--orange);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button.upload-btn:hover { background: #e0700f; }
  button.upload-btn:disabled {
    background: #d1d5db;
    cursor: not-allowed;
  }
  .status {
    margin-top: 16px;
    font-size: 14px;
    display: none;
  }
  .status.loading { color: var(--gray); }
  .status.success { color: var(--success); }
  .status.error { color: var(--error); }
  .result-box {
    margin-top: 12px;
    padding: 14px;
    background: var(--light-bg);
    border-radius: 8px;
    display: none;
  }
  .result-box.show { display: block; }
  .result-box label {
    font-size: 12px;
    color: var(--gray);
    display: block;
    margin-bottom: 6px;
  }
  .result-row {
    display: flex;
    gap: 8px;
  }
  .result-row input {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    color: var(--dark);
    background: #fff;
  }
  .result-row button {
    padding: 8px 14px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .result-row button:hover { background: var(--light-bg); }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #d1d5db;
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .history {
    margin-top: 28px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }
  .history h2 {
    font-size: 14px;
    color: var(--gray);
    margin: 0 0 12px;
    font-weight: 600;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--light-bg);
    font-size: 13px;
  }
  .history-item img {
    width: 36px;
    height: 36px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .history-item .link {
    flex: 1;
    color: var(--dark);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-item button {
    border: none;
    background: none;
    color: var(--orange);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
  }
  .empty-history {
    font-size: 13px;
    color: #9ca3af;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Unifresh Product Image Uploader</h1>
  <p class="subtitle">Drop an image below to upload it and get a shareable link instantly.</p>

  <div class="dropzone" id="dropzone">
    <div class="icon">📷</div>
    <p><strong>Click to select</strong> or drag & drop an image here</p>
    <input type="file" id="fileInput" accept="image/*" />
  </div>

  <div class="preview" id="preview">
    <img id="previewImg" src="" alt="Preview" />
    <div class="filename" id="fileName"></div>
  </div>

  <button class="upload-btn" id="uploadBtn" disabled>Upload Image</button>

  <div class="status" id="status"></div>

  <div class="result-box" id="resultBox">
    <label>Shareable Link</label>
    <div class="result-row">
      <input type="text" id="resultUrl" readonly />
      <button id="copyBtn">Copy</button>
    </div>
  </div>

  <div class="history">
    <h2>Recent uploads (this session)</h2>
    <div id="historyList">
      <div class="empty-history">No uploads yet.</div>
    </div>
  </div>
</div>

<script>
  const WORKER_URL = "https://image-uploader.digitalmarketing-unifresh.workers.dev";
  const UPLOAD_KEY = "Unifresh@001";

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('previewImg');
  const fileNameEl = document.getElementById('fileName');
  const uploadBtn = document.getElementById('uploadBtn');
  const statusEl = document.getElementById('status');
  const resultBox = document.getElementById('resultBox');
  const resultUrl = document.getElementById('resultUrl');
  const copyBtn = document.getElementById('copyBtn');
  const historyList = document.getElementById('historyList');

  let selectedFile = null;
  const history = [];

  dropzone.addEventListener('click', () => fileInput.click());

  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });

  dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('dragover');
  });

  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
      handleFile(e.dataTransfer.files[0]);
    }
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) {
      handleFile(e.target.files[0]);
    }
  });

  function handleFile(file) {
    if (!file.type.startsWith('image/')) {
      showStatus('error', 'Please select an image file.');
      return;
    }
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = (e) => {
      previewImg.src = e.target.result;
      preview.style.display = 'block';
    };
    reader.readAsDataURL(file);
    fileNameEl.textContent = file.name;
    uploadBtn.disabled = false;
    resultBox.classList.remove('show');
    hideStatus();
  }

  function showStatus(type, message) {
    statusEl.className = 'status ' + type;
    statusEl.style.display = 'block';
    statusEl.innerHTML = type === 'loading'
      ? '<span class="spinner"></span>' + message
      : message;
  }

  function hideStatus() {
    statusEl.style.display = 'none';
  }

  uploadBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    uploadBtn.disabled = true;
    showStatus('loading', 'Uploading image...');
    resultBox.classList.remove('show');

    try {
      const formData = new FormData();
      formData.append('file', selectedFile);

      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'X-Upload-Key': UPLOAD_KEY },
        body: formData,
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(errText || ('Upload failed with status ' + res.status));
      }

      const data = await res.json();

      showStatus('success', 'Upload successful!');
      resultUrl.value = data.url;
      resultBox.classList.add('show');

      addToHistory(data.url, previewImg.src);

      // Reset for next upload
      selectedFile = null;
      fileInput.value = '';
      uploadBtn.disabled = true;

    } catch (err) {
      showStatus('error', 'Upload failed: ' + err.message);
      uploadBtn.disabled = false;
    }
  });

  copyBtn.addEventListener('click', () => {
    resultUrl.select();
    resultUrl.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(resultUrl.value).then(() => {
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
    });
  });

  function addToHistory(url, thumbSrc) {
    if (history.length === 0) {
      historyList.innerHTML = '';
    }
    history.unshift({ url, thumbSrc });

    historyList.innerHTML = '';
    history.forEach(item => {
      const row = document.createElement('div');
      row.className = 'history-item';
      row.innerHTML = `
        <img src="${item.thumbSrc}" alt="thumb" />
        <div class="link">${item.url}</div>
        <button onclick="navigator.clipboard.writeText('${item.url}'); this.textContent='Copied!'; setTimeout(()=>this.textContent='Copy', 1200);">Copy</button>
      `;
      historyList.appendChild(row);
    });
  }
</script>

</body>
</html>
